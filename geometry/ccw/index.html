<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCW Visualizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="points">
        <div class="point" data-point="A">A</div>
        <div class="point" data-point="B">B</div>
        <div class="point" data-point="C">C</div>
      </div>

      <aside class="hud">
        <div class="hud-title">CCW Visualizer</div>
        <div class="hud-section" id="coords"></div>
        <div class="hud-section" id="result"></div>
        <div class="hud-section buttons">
          <button data-preset="reset">Reset</button>
          <button data-preset="ccw">CCW Example</button>
          <button data-preset="line">Collinear</button>
          <button data-preset="cw">CW Example</button>
        </div>
      </aside>
    </div>

    <script src="script.js"></script>
  </body>
</html>
